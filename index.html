<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un regalo especial ❤️</title>
    <style>
        body { background-color: #ffebee; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; background-image: url('https://i.imgur.com/83pY6In.png'); background-size: cover; }
        .card { background: rgba(255, 255, 255, 0.9); padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 300px; border: 2px solid #f8bbd0; }
        h1 { color: #d81b60; font-size: 22px; }
        .bear { width: 150px; margin-bottom: 10px; }
        .gift-box { width: 100px; cursor: pointer; transition: 0.3s; }
        .gift-box:hover { transform: scale(1.1); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; flex-direction: column; }
        .photo { max-width: 80%; border: 5px solid white; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://i.imgur.com/B9O0S50.png" class="bear">
        <h1 id="nombreAmiga">¡Feliz San Valentín!</h1>
        <p>Tengo una sorpresa para ti...</p>
        <img src="https://i.imgur.com/vHqY7rE.gif" class="gift-box" onclick="mostrar()">
        <p style="font-size: 12px;">(Toca la caja)</p>
    </div>
    <div class="overlay" id="overlay" onclick="ocultar()">
        <img src="https://i.imgur.com/6X2VbXf.png" class="photo">
        <p style="color:white; margin-top:10px;">¡Te quiero mucho!</p>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let nombre = urlParams.get('nombre');
        if (nombre) { document.getElementById('nombreAmiga').innerText = "¡Feliz San Valentín, " + nombre.replace(/_/g, ' ') + "!"; }
        function mostrar() { document.getElementById('overlay').style.display = 'flex'; }
        function ocultar() { document.getElementById('overlay').style.display = 'none'; }
    </script>
</body>
</html>
